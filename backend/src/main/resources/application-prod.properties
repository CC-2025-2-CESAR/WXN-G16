# Esse arquivo está sendo criado pra separar a config de produção.
# Se alguma variável estiver faltando no deploy, a aplicação não inicia
# e fica sem nenhum endereço ou credencial local por engano.


# WARN: Em produção esses valores devem vir do ambiente de deploy.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Serve pra não exibir consultas do SQL nos logs de produção.
spring.jpa.show-sql=false

# Endereços configurados no ambiente de deploy
wxn.api.base-url=${WXN_API_BASE_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
