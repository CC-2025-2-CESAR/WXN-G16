# Esse arquivo está sendo criado pra separar a config de produção.
# Se alguma variável estiver faltando no deploy, a aplicação não inicia
# e fica sem nenhum endereço ou credencial local por engano.


# WARN: Em produção esses valores devem vir do ambiente de deploy.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Serve pra não exibir consultas do SQL nos logs de produção.
spring.jpa.show-sql=false

# Endereços configurados no ambiente de deploy
wxn.api.base-url=${WXN_API_BASE_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# O frontend (azurestaticapps.net) e o backend (azurewebsites.net) sao sites diferentes: sem SameSite=None o navegador
# nao manda o cookie de sessao e ninguem consegue logar (o CSRF continua protegido pelo token, e o CORS so aceita a
# origem do frontend). Partitioned (CHIPS) mantem o login nos navegadores que bloqueiam cookie de terceiros.
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}
server.servlet.session.cookie.partitioned=${SESSION_COOKIE_PARTITIONED:true}
