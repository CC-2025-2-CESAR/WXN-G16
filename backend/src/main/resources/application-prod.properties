# Perfil prod: ative com SPRING_PROFILES_ACTIVE=prod na plataforma de deploy.
# Aqui nao ha defaults: se alguma variavel faltar, o backend nao sobe, em vez de
# apontar para um banco local que nao existe.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.jpa.show-sql=false
