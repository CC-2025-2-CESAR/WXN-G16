spring.application.name=backend

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Banco de dados (PostgreSQL)
#
# Os valores a direita de ":" sao defaults usados quando a variavel de
# ambiente nao esta definida. Isso permite rodar o backend localmente sem
# nenhuma configuracao extra, desde que o banco local siga o padrao
# documentado no README (banco "wxn_chatbot", usuario "wxn_user").
#
# Em producao (deploy), DB_URL / DB_USER / DB_PASSWORD devem ser definidas
# como variaveis de ambiente reais na plataforma de hospedagem - nunca
# commitadas aqui. Veja o .env.example na raiz do repositorio.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wxn_chatbot}
spring.datasource.username=${DB_USER:wxn_user}
spring.datasource.password=${DB_PASSWORD:wxn_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
#
# As tabelas sao criadas pelo Flyway (db/migration). O Hibernate so valida se
# as entidades batem com elas.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# API da WXN (sem a real, aponta para o mock; ver docs/integracao-wxn.md)
wxn.api.base-url=${WXN_API_BASE_URL:http://localhost:${server.port}/mock/wxn}
wxn.api.timeout-conexao=2s
wxn.api.timeout-leitura=3s

# ---------------------------------------------------------------------------
# CORS (consumido em br.com.wxnchatbot.backend.config.CorsConfig)
# Lista separada por virgula de origens permitidas a chamar a API.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
