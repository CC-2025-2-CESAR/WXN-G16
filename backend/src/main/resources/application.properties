spring.application.name=backend

# Já que crie o applicaiton application-dev.properties, tenho que associar
# o perfil mock a ele.

# Aqui vai usar dev quando nenhum perfil for informado.
spring.profiles.default=dev

# Quando dev for ativado, ativa o perfil mock também.
spring.profiles.group.dev=mock

# O demo traz o dev junto, para rodar sozinho com o banco e o mock locais.
spring.profiles.group.demo=dev

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
# ---------------------------------------------------------------------------
# Banco de dados (PostgreSQL)
#
# Os valores a direita de ":" sao defaults usados quando a variavel de
# ambiente nao esta definida. Isso permite rodar o backend localmente sem
# nenhuma configuracao extra, desde que o banco local siga o padrao
# documentado no README (banco "wxn_chatbot", usuario "wxn_user").
#
# Em producao (deploy), DB_URL / DB_USER / DB_PASSWORD devem ser definidas
# como variaveis de ambiente reais na plataforma de hospedagem - nunca
# commitadas aqui. Veja o .env.example na raiz do repositorio.
# ---------------------------------------------------------------------------

spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
#
# As tabelas sao criadas pelo Flyway (db/migration). O Hibernate so valida se
# as entidades batem com elas.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# API da WXN (sem a real, aponta para o mock; ver docs/integracao-wxn.md)
wxn.api.timeout-conexao=2s
wxn.api.timeout-leitura=3s

# ---------------------------------------------------------------------------
# Chatbot (Lily)
#
# chatbot.llm: "fake" responde com um texto fixo e classifica por palavras-chave;
# "gemini" chama o Gemini (exige GEMINI_API_KEY, definida so no ambiente).
# ---------------------------------------------------------------------------
chatbot.llm=${CHATBOT_LLM:fake}

# Abaixo dessa confianca a intencao vira "incerta" e a conversa vai para um atendente.
chatbot.intencao.limiar-confianca=0.7

# Entrada do chatbot pela API (POST /api/chat/mensagens). Gasta a cota da LLM e
# cadastra clientes, entao fica desligada por padrao; o perfil dev liga.
chat.api.habilitada=${CHAT_API_HABILITADA:false}

# Empresa onde entram os telefones que ainda nao tem cadastro. Vazio = so atende
# telefones ja cadastrados.
chat.empresa-padrao=${CHAT_EMPRESA_PADRAO:}

# Gemini (so e usado com chatbot.llm=gemini)
gemini.api-key=${GEMINI_API_KEY:}
gemini.modelo=${GEMINI_MODELO:gemini-3.5-flash-lite}
gemini.nivel-de-pensamento=${GEMINI_NIVEL_DE_PENSAMENTO:low}
gemini.timeout-conexao=3s
gemini.timeout-leitura=20s

# ---------------------------------------------------------------------------
# WhatsApp (Cloud API da Meta). Desligado por padrao; veja docs/whatsapp.md.
# ---------------------------------------------------------------------------
whatsapp.habilitado=${WHATSAPP_HABILITADO:false}
whatsapp.token-de-verificacao=${WHATSAPP_TOKEN_DE_VERIFICACAO:}
whatsapp.segredo-do-app=${WHATSAPP_SEGREDO_DO_APP:}
whatsapp.token-de-acesso=${WHATSAPP_TOKEN_DE_ACESSO:}
whatsapp.id-do-numero=${WHATSAPP_ID_DO_NUMERO:}
whatsapp.versao-da-api=${WHATSAPP_VERSAO_DA_API:v26.0}

# ---------------------------------------------------------------------------
# CORS (consumido em br.com.wxnchatbot.backend.config.CorsConfig)
# Lista separada por virgula de origens permitidas a chamar a API.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Toda essa parte vai servir pra configurar o Actuator, para que o endpoint
# /actuator/health/readiness consiga dizer se a aplicação está pronta e
# também se a aplicação consegue acessar o banco.
# Vai expor somente o endpoint de saúde do actuator.
management.endpoints.web.exposure.include=health

# Habilita o endpoint e liveness do Spring Boot.
management.endpoint.health.probes.enabled=true

# Inclui a checagem do banco no endpoint que citei acima.
management.endpoint.health.group.readiness.include=readinessState,db

# Nao revela detalhes internos na reposta.
management.endpoint.health.show-details=never
