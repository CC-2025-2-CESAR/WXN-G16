# Toda vez que entramos no perfil dev, esse arquivo deve ser carregado.

# Banco local usado durante o desenvolvimento.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wxn_chatbot}
spring.datasource.username=${DB_USER:wxn_user}
spring.datasource.password=${DB_PASSWORD:wxn_password}

# Vai mostrar as consultas do SQL no console.
spring.jpa.show-sql=true

# API simulada
wxn.api.base-url=${WXN_API_BASE_URL:http://localhost:${server.port}/mock/wxn}

# Entrada do chatbot pela API ligada em dev; os telefones novos entram na empresa da demonstração.
chat.api.habilitada=${CHAT_API_HABILITADA:true}
chat.empresa-padrao=${CHAT_EMPRESA_PADRAO:Empresa Demonstração}

# Será usada pra permitir chamadas do frontend local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
