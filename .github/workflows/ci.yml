name: CI

# Serve pra validar Pull Request para as branchs develop e main.
# Testes do backend com Postgres, lint, typecheck e build do frontend, e
# varredura de segredos (gitleaks) nos commits do PR.
# Os Workflows de deploy só rodam depois do merge na main e pulam os testes,
# então esté é o único lugar onde são executados
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wxn_user
          POSTGRES_PASSWORD: wxn_password
          POSTGRES_DB: wxn_chatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wxn_user -d wxn_chatbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testes
        run: ./mvnw -B verify

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (lint, tipos e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos e build
        run: npm run build

  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Histórico completo: o gitleaks precisa dos commits do PR, não só do último
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Baixa o binário e confere o SHA-256 publicado na release. Não usa a action
      # oficial porque ela exige licença paga em repositório de organização
      - name: Instala o gitleaks
        env:
          VERSAO: "8.30.1"
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      # Em PR olha só os commits do PR; no disparo manual olha o histórico inteiro.
      # --redact esconde o valor achado, porque o log do Actions é público
      - name: Procura segredos
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TOPO: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gitleaks git --redact -v --log-opts="${BASE}..${TOPO}"
          else
            ./gitleaks git --redact -v --log-opts="--all"
          fi
