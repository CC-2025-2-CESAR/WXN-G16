name: Deploy backend to Azure

# Builda o backend (precisa de JDK 21, por isso roda aqui e não localmente)
# e publica no Azure App Service (wxn-g16-backend) a cada push em main que
# mexe em backend/ — produção só reflete a main, nunca a develop, seguindo
# o fluxo de branches do README. Ver docs/deploy.md para o resto do
# ambiente (Static Web Apps, Neon).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build (sem testes — precisam do Postgres rodando)
        run: ./mvnw clean package -DskipTests

      - uses: azure/webapps-deploy@v3
        id: deploy
        with:
          app-name: wxn-g16-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/target/*.jar

      - name: Esperar o backend responder
        env:
          URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          URL="${URL:-https://wxn-g16-backend.azurewebsites.net}"
          for i in $(seq 1 16); do
            codigo=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "$URL/api/health" || true)
            echo "tentativa $i: HTTP $codigo"
            if [ "$codigo" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::O backend não respondeu 200 em /api/health depois do deploy. Ver docs/deploy.md (Quando o site cai)."
          exit 1
