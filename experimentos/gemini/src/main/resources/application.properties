spring.application.name=experimento-gemini
spring.main.web-application-type=none
spring.main.banner-mode=off

logging.level.root=WARN
logging.level.br.com.wxnchatbot=INFO

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.thinking-level=${NIVEL_DE_PENSAMENTO:LOW}
spring.ai.google.genai.chat.include-thoughts=${INCLUIR_PENSAMENTOS:false}

experimento.modelos=gemini-3.5-flash-lite,gemini-3.8-flash
experimento.pausa=4s
experimento.rapido=false
experimento.pasta-resultados=resultados
